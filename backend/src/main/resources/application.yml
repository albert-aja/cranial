spring:
  application:
    name: cranial-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cranial}?stringtype=unspecified
    username: ${POSTGRES_USER:cranial}
    password: ${POSTGRES_PASSWORD:change-me-local-postgres-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
  global-config:
    banner: false

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: cranial

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

cranial:
  environment: ${SPRING_PROFILES_ACTIVE:dev}
  ratelimit:
    provider: ${CRANIAL_RATELIMIT_PROVIDER:in-memory}
  maintenance:
    cron: ${CRANIAL_MAINTENANCE_CRON:0 0 * * * *}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  security:
    api-key-pepper: ${CRANIAL_API_KEY_PEPPER:}
    encryption-key: ${CRANIAL_ENCRYPTION_KEY:}
    admin-jwt-secret: ${CRANIAL_ADMIN_JWT_SECRET:}
    admin-jwt-ttl-minutes: ${CRANIAL_ADMIN_JWT_TTL_MINUTES:30}
    context-max-skew-seconds: 300
    admin-login-rpm: 15
  bootstrap:
    admin-email: ${CRANIAL_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${CRANIAL_BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${CRANIAL_BOOTSTRAP_ADMIN_NAME:CRANIAL Operator}
  document:
    storage-dir: ${CRANIAL_DOCUMENT_STORAGE_DIR:${java.io.tmpdir}/cranial-doc-store}
    max-document-bytes: ${CRANIAL_DOCUMENT_MAX_BYTES:10485760}
    upload-url-ttl-minutes: ${CRANIAL_DOCUMENT_UPLOAD_URL_TTL_MINUTES:15}
    download-url-ttl-minutes: ${CRANIAL_DOCUMENT_DOWNLOAD_URL_TTL_MINUTES:5}
    tesseract-command: ${CRANIAL_TESSERACT_CMD:tesseract}
    tesseract-timeout-seconds: ${CRANIAL_TESSERACT_TIMEOUT_SECONDS:30}
    async-page-threshold: ${CRANIAL_DOCUMENT_ASYNC_PAGE_THRESHOLD:5}

