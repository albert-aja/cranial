spring:
  datasource:
    url: jdbc:h2:mem:cranial_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/h2-compat,classpath:db/migration

management:
  health:
    redis:
      enabled: false

cranial:
  environment: test
  security:
    api-key-pepper: test-api-key-pepper-with-high-entropy-value-32b+
    encryption-key: test-aes256-master-encryption-key-value-32bytes+
    admin-jwt-secret: test-admin-jwt-signing-secret-key-value-32bytes+
    admin-jwt-ttl-minutes: 30
    context-max-skew-seconds: 300
    admin-login-rpm: 50
  bootstrap:
    admin-email: admin@cranial.test
    admin-password: TestAdminPassword!2026
    admin-name: Test Super Admin
  document:
    storage-dir: target/cranial-test-doc-store
    max-document-bytes: 5242880

